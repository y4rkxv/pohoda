pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,jsx,json,css,html,md}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: |
        grep -qE '^(feat|fix|refactor|docs|style|test|chore|perf|ci|build|revert)(\([^)]+\))?!?: .+' {1}
      fail_text: "❌ Invalid commit message! Use format: <type>(<scope>): <desc>. Types: feat|fix|refactor|docs|style|test|chore|perf|ci|build|revert"